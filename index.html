<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saidolim | LinkHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background:
                linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.82)),
                url("./ChatGPT Image 2 сент. 2026 г., 19_32_18.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .football {
            font-size: 65px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .surname {
            color: #aaa;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 16px;
            margin-bottom: 25px;
        }

        .info {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .info p {
            margin: 8px 0;
            font-size: 15px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            transition: 0.3s;
            font-weight: bold;
        }

        .button:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .telegram {
            background: rgba(0,136,204,0.35);
        }

        .email {
            background: rgba(180,180,180,0.15);
        }

        .github {
            background: rgba(50,50,50,0.8);
        }

        .instagram {
            background: rgba(180,60,120,0.3);
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        .line {
            height: 2px;
            width: 80px;
            margin: 18px auto;
            background: white;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="football">⚽</div>

        <h1>Saidolim</h1>

        <div class="surname">
            Murodillaev
        </div>

        <div class="line"></div>

        <p class="bio">
            ⚽ Football lover • Real Madrid
        </p>

        <div class="info">
            <p>👤 <strong>Name:</strong> Saidolim Murodillaev</p>
            <p>⚽ <strong>Favorite club:</strong> Real Madrid</p>
            <p>📱 <strong>Instagram:</strong> I haven't Insta</p>
            <p>💻 <strong>GitHub:</strong> I haven't GitHub</p>
        </div>

        <a class="button telegram"
           href="https://t.me/murodullyev"
           target="_blank">
            ✈️ Telegram — @murodullyev
        </a>

        <a class="button email"
           href="mailto:saidolimm086@gmail.com">
            📧 Email — saidolimm086@gmail.com
        </a>

        <a class="button github"
           href="#"
           onclick="return false;">
            💻 GitHub
        </a>

        <a class="button instagram"
           href="#"
           onclick="return false;">
            📸 Instagram
        </a>

        <footer>
            Made with ⚽ by Saidolim
        </footer>

    </div>

</body>
</html>
