<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saidolim | Links</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .bio {
            color: #cbd5e1;
            font-size: 15px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;
            background: #334155;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .link:hover {
            transform: translateY(-3px);
            background: #475569;
        }

        .email {
            background: #2563eb;
        }

        .email:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">
            <div class="avatar">S</div>

            <h1>Saidolim</h1>

            <p class="bio">
                Murodillaev • ⚽ Real Madrid
            </p>
        </div>

        <div class="links">

            <a class="link" href="https://t.me/murodullyev" target="_blank">
                📱 Telegram
            </a>

            <a class="link" href="mailto:saidolimm086@gmail.com">
                📧 Email
            </a>

            <a class="link" href="https://github.com/" target="_blank">
                💻 GitHub
            </a>

            <a class="link" href="https://www.instagram.com/" target="_blank">
                📸 Instagram
            </a>

        </div>

        <div class="footer">
            © 2026 Saidolim
        </div>

    </div>

</body>
</html>
