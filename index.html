<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saidolim | LinkHub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(2, 8, 20, 0.45),
            rgba(2, 8, 20, 0.88)
        ),
        url("./ChatGPT Image 2 сент. 2026 г., 19_32_18.png")
        center center / cover fixed no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 430px;
}

.card {
    text-align: center;
    padding: 35px 25px;

    background: rgba(5, 15, 30, 0.62);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 28px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55);
}

/* Profile */

.avatar {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;

    border-radius: 50%;

    background:
        linear-gradient(135deg, #ffffff, #94a3b8);

    border: 4px solid rgba(255,255,255,0.8);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 48px;
}

h1 {
    font-size: 38px;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

.username {
    color: #cbd5e1;
    font-size: 17px;
    margin-bottom: 12px;
}

.bio {
    color: #e2e8f0;
    font-size: 14px;
    margin-bottom: 28px;
}

/* Football line */

.line {
    width: 80px;
    height: 3px;
    margin: 0 auto 25px;

    background: white;
    border-radius: 10px;
}

/* Buttons */

.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.link {
    display: block;
    text-decoration: none;
    color: white;

    padding: 17px;
    border-radius: 16px;

    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);

    font-size: 16px;
    font-weight: bold;

    transition: all 0.25s ease;
}

.link:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.20);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.telegram {
    background: rgba(37, 99, 235, 0.72);
}

.telegram:hover {
    background: rgba(37, 99, 235, 0.95);
}

.email {
    background: rgba(255,255,255,0.12);
}

/* Footer */

.footer {
    margin-top: 28px;
    color: #94a3b8;
    font-size: 12px;
}

.football {
    font-size: 24px;
    margin-bottom: 8px;
}

@media (max-width: 500px) {
    body {
        padding: 15px;
    }

    .card {
        padding: 30px 20px;
    }

    h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="avatar">
            ⚽
        </div>

        <h1>Saidolim</h1>

        <div class="username">
            Murodillaev
        </div>

        <div class="bio">
            ⚽ Football lover • Real Madrid
        </div>

        <div class="line"></div>

        <div class="links">

            <a
                class="link telegram"
                href="https://t.me/murodullyev"
                target="_blank"
            >
                📱 Telegram
            </a>

            <a
                class="link email"
                href="mailto:saidolimm086@gmail.com"
            >
                📧 Email
            </a>

        </div>

        <div class="footer">
            <div class="football">⚽</div>
            © 2026 Saidolim
        </div>

    </div>

</div>

</body>
</html>
